<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - LM Studio Auto Optimizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="app">
        <nav class="bg-white border-b border-gray-200 sticky top-0 z-40">
            <div class="container mx-auto px-4">
                <div class="flex items-center justify-between h-16">
                    <div class="flex items-center space-x-8">
                        <a href="/" class="flex items-center space-x-2">
                            <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                            </svg>
                            <span class="text-xl font-bold text-gray-900">LM Optimizer</span>
                        </a>
                        <div class="hidden md:flex space-x-6">
                            <a href="/" class="nav-link text-gray-600 hover:text-blue-600 font-medium">Dashboard</a>
                            <a href="/history" class="nav-link text-blue-600 font-medium">History</a>
                            <a href="/settings" class="nav-link text-gray-600 hover:text-blue-600 font-medium">Settings</a>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span id="lm-status" class="status-badge status-offline text-sm font-medium">
                            <span class="status-dot"></span>Disconnected
                        </span>
                    </div>
                </div>
            </div>
        </nav>

        <main class="container mx-auto px-4 py-8" id="main-content">
            <div class="flex justify-center py-12"><div class="spinner"></div></div>
        </main>
    </div>

    <script type="module" src="/static/js/history.js"></script>
</body>
</html>

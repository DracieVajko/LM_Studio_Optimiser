<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Config JSON - LM Studio Auto Optimizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2'%3E%3Cpath stroke-linecap='round' stroke-linejoin='round' d='M13 10V3L4 14h7v7l9-11h-7z'/%3E%3C/svg%3E">
    <script src="/static/js/theme.js?v=6"></script>
    <script src="/static/js/navstatus.js?v=6"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="app">
        <nav class="bg-white border-b border-gray-200 sticky top-0 z-40">
            <div class="container mx-auto px-4">
                <div class="flex items-center justify-between h-16">
                    <div class="flex items-center space-x-8">
                        <a href="/" class="flex items-center space-x-2">
                            <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                            </svg>
                            <span class="text-xl font-bold text-gray-900">LM Optimizer</span>
                        </a>
                        <div class="hidden md:flex space-x-6">
                            <a href="/" class="nav-link text-gray-600 hover:text-blue-600 font-medium">Dashboard</a>
                            <a href="/history" class="nav-link text-gray-600 hover:text-blue-600 font-medium">History</a>
                            <a href="/sandbox" class="nav-link text-gray-600 hover:text-blue-600 font-medium">Sandbox</a>
                            <a href="/settings" class="nav-link text-gray-600 hover:text-blue-600 font-medium">Settings</a>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <button class="theme-toggle btn btn-outline btn-sm" aria-label="Toggle dark mode">🌙</button>
                        <span id="lm-status" class="status-badge status-offline text-sm font-medium">
                            <span class="status-dot"></span>Disconnected
                        </span>
                    </div>
                </div>
            </div>
        </nav>
        <main class="container mx-auto px-4 py-8">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h1 class="text-xl font-bold">Configuration JSON</h1>
                    <p class="text-xs text-gray-500 font-mono">{{ run_id }} / {{ config_id }}</p>
                </div>
                <div class="flex gap-2">
                    <button class="btn btn-outline btn-sm" onclick="navigator.clipboard.writeText(document.getElementById('json-pre').textContent)">Copy</button>
                    <a class="btn btn-outline btn-sm" href="/results/{{ run_id }}">Back to run</a>
                </div>
            </div>
            <pre id="json-pre" class="font-mono text-xs bg-white border rounded p-4 overflow-auto">{{ payload }}</pre>
        </main>
    </div>
</body>
</html>

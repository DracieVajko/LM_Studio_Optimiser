[project]
name = "lm-optimizer"
version = "1.0.0b0"
description = "Hardware-aware automatic benchmark and optimization tool for LM Studio. Finds empirically optimized runtime configurations for speed, context, memory, and quality across different hardware."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "rich>=13.7.0",
    "psutil>=5.9.0",
    "GPUtil>=1.4.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "orjson>=3.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "jinja2>=3.1.0",
    "websockets>=12.0.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "T20", "TCH", "TRY", "PD", "ARG", "PTH", "ERA", "RUF", "RET", "SIM", "TID", "PL", "NPY", "PERF", "FURB"]
ignore = ["ANN001", "ANN002", "ANN003", "ARG001", "ARG002", "T201", "T203", "PTH118", "PTH123"]
fixable = ["F", "I", "UP", "W", "C90", "T20", "TCH", "TRY", "PD", "ARG", "PTH", "ERA", "RUF", "RET", "SIM", "TID", "PL", "NPY", "PERF", "FURB"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["lm_optimizer/tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.setuptools.packages.find]
where = ["."]
include = ["lm_optimizer*"]